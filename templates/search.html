{% extends 'base.html' %}

{% block title %}Search - SNM {% endblock %}

{% block content %}
        <div class="container">
            <div class="search-container">
                <h2>🔍 Search Notes</h2>
                <form method="POST" action="search.html" class="search-form">
                    <input type="text" name="query" placeholder="Search notes by title or content..." required>
                    <button type="submit" class="btn btn-primary" style="width: auto;">Search</button>
                </form>
            </div>
            
            <!-- Search Results -->
            <div class="notes-container">
                <h2>Search Results for "meeting"</h2>
                <div class="notes-grid">
                    <div class="note-card">
                        <h4>Meeting Notes</h4>
                        <p>Important points from the team meeting about the project...</p>
                        <a href="view_note.html">View Note</a>
                    </div>
                </div>
            </div>
        </div>
{% endblock %}
