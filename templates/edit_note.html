{% extends 'base.html' %}

{% block title %} Edit Note - SNM {% endblock %}

        <div class="container">
            <div class="card" style="max-width: 600px;">
                <h2>✏️ Edit Note</h2>
                <form method="POST" action="view_note.html">
                    <div class="form-group">
                        <label for="title">Note Title</label>
                        <input type="text" id="title" name="title" value="My First Note" required>
                    </div>
                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea id="description" name="description" required>This is the existing content of the note that will be edited.</textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Update Note</button>
                </form>
                <p class="text-center">
                    <a href="view_note.html">← Back to Note</a>
                </p>
            </div>
        </div>
{% endblock %}
