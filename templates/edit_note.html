<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Note - SNM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navigation (Logged In) -->
    <nav class="navbar">
        <a href="home.html" class="logo">📝 SNM</a>
        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="notes.html">My Notes</a>
            <a href="files.html">My Files</a>
            <a href="login.html">Logout</a>
        </div>
    </nav>
    
    <!-- Main Content -->
    <main>
        <div class="container">
            <div class="card" style="max-width: 600px;">
                <h2>✏️ Edit Note</h2>
                <form method="POST" action="view_note.html">
                    <div class="form-group">
                        <label for="title">Note Title</label>
                        <input type="text" id="title" name="title" value="My First Note" required>
                    </div>
                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea id="description" name="description" required>This is the existing content of the note that will be edited.</textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Update Note</button>
                </form>
                <p class="text-center">
                    <a href="view_note.html">← Back to Note</a>
                </p>
            </div>
        </div>
    </main>
    
    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2024 SNM - Simple Notes Management. All rights reserved.</p>
    </footer>
</body>
</html>
