<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP - SNM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <a href="home.html" class="logo">📝 SNM</a>
        <div class="nav-links">
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
        </div>
    </nav>
    
    <!-- Main Content -->
    <main>
        <div class="container">
            <div class="card">
                <h2>✉️ Verify Your Email</h2>
                <p class="text-center">We've sent a 6-digit OTP to your email address.</p>
                <form method="POST" action="login.html">
                    <div class="form-group">
                        <label for="otp">Enter OTP</label>
                        <input type="text" id="otp" name="otp" placeholder="Enter 6-digit OTP" maxlength="6" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Verify OTP</button>
                </form>
                <p class="text-center">
                    Didn't receive OTP? <a href="verify_otp.html">Resend OTP</a>
                </p>
            </div>
        </div>
    </main>
    
    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2024 SNM - Simple Notes Management. All rights reserved.</p>
    </footer>
</body>
</html>
